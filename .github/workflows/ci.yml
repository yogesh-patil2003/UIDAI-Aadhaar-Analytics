name: Python Validation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax and notebook JSON validity
        run: |
          python -m py_compile scripts/analyze_uidai.py
          python -m json.tool notebooks/uidai_demographic_analysis.ipynb > /dev/null
          python -m json.tool notebooks/uidai_enrolment_dashboard.ipynb > /dev/null
